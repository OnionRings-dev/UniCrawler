services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mapper:
    build:
      context: ./mapper
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      INPUT_QUEUE: mapper:in
      OUTPUT_QUEUE: mapper:out
      WORKERS: "128"
      REDIS_POOL_SIZE: "256"
      SAME_DOMAIN_MODE: registrable
      REDIS_BATCH_SIZE: "1000"
      REQUEST_TIMEOUT: 15s
    restart: unless-stopped

volumes:
  redis-data:
