services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unicrawler
      POSTGRES_USER: unicrawler
      POSTGRES_PASSWORD: unicrawler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicrawler -d unicrawler"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  mapper:
    build:
      context: ./mapper
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://unicrawler:unicrawler@postgres:5432/unicrawler?sslmode=disable
      INPUT_QUEUE: mapper:in
      OUTPUT_QUEUE: mapper:out
      WORKERS: "128"
      REDIS_POOL_SIZE: "256"
      SAME_DOMAIN_MODE: registrable
      REDIS_BATCH_SIZE: "1000"
      REQUEST_TIMEOUT: 15s
    restart: unless-stopped

  parser:
    build:
      context: ./parser
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://unicrawler:unicrawler@postgres:5432/unicrawler?sslmode=disable
      INPUT_QUEUE: mapper:out
      OUTPUT_QUEUE: parser:out
      WORKERS: "${PARSER_WORKERS:-4}"
      REDIS_POOL_SIZE: "${PARSER_REDIS_POOL_SIZE:-8}"
      REQUEST_TIMEOUT: 30s
      RENDER_TIMEOUT: 60s
      MAX_PDF_BYTES: "52428800"
      MAX_RETRIES: "2"
      USER_AGENT: UniCrawlerParser/0.1
    shm_size: "1gb"
    deploy:
      replicas: ${PARSER_REPLICAS:-1}
    restart: unless-stopped

  vectorizer:
    build:
      context: ./vectorizer
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://unicrawler:unicrawler@postgres:5432/unicrawler?sslmode=disable
      QDRANT_URL: http://qdrant:6333
      INPUT_QUEUE: parser:out
      PROCESSING_QUEUE: vectorizer:processing
      FAILED_QUEUE: vectorizer:failed
      REDIS_SOCKET_TIMEOUT: "15"
      COLLECTION_PREFIX: unicrawler
      COLLECTION_SCOPE: domain
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-fastembed}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      CHUNK_TOKENS: "${VECTOR_CHUNK_TOKENS:-700}"
      CHUNK_OVERLAP_TOKENS: "${VECTOR_CHUNK_OVERLAP_TOKENS:-100}"
      BATCH_SIZE: "${VECTOR_BATCH_SIZE:-32}"
      MAX_RETRIES: "${VECTOR_MAX_RETRIES:-3}"
    volumes:
      - vectorizer-cache:/root/.cache
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  vectorizer-cache:
