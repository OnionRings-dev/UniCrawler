[project]
name = "rag-demo"
version = "0.1.0"
description = "Agentic RAG demo over UniCrawler Qdrant collections"
readme = "README.md"
authors = [
    { name = "TeoBale", email = "matteo.balestriero@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "langchain>=1.3.4",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "rich>=15.0.0",
    "sentence-transformers>=5.5.1",
    "textual>=8.2.7",
]

[project.scripts]
rag-demo = "rag_demo:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
